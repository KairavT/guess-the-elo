# Guess the Elo — JSON API Worker (src/index.js). The frontend lives on
# alexanderli.dev/elo.html in the site's own design; non-/api/ requests to
# this Worker just redirect there.
name = "guess-the-elo"
main = "src/index.js"
compatibility_date = "2026-08-22"

[observability]
enabled = true

# ---------------------------------------------------------------------------
# D1 database binding. Exposed to the Worker as `env.DB`.
# database_id intentionally omitted: wrangler >= 4.45 auto-provisions the
# database on first `wrangler deploy`. After deploying, initialise it with:
#   npm run db:init && npm run db:seed
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "guess-the-elo-db"
